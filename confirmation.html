    <header>
        <h1>Order Confirmation</h1>
    </header>

    <main>
        <section id="confirmation-details">
            <h2>Thank you for your order, <span id="customer-name"></span>!</h2>
            <p>✅ Your order is confirmed and will be delivered by <span id="delivery-date"></span>.</p>
        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
    // Get query parameters from the URL
    const urlParams = new URLSearchParams(window.location.search);
    const customerName = urlParams.get("name");
    const deliveryDate = urlParams.get("deliveryDate");

    // Update the confirmation page with the customer's details
    document.getElementById("customer-name").textContent = customerName;
    document.getElementById("delivery-date").textContent = deliveryDate;
});

    </script>
